# A storm at the sender's full rate: 10 000 routes announced 100 more
# times, 1 000 000 re-announcements. The receiver reads as fast as it can,
# so only the receiving side of gobgpd can fall behind.
family            = "ipv4"
routes            = 10000
routes_per_update = 1
receivers         = 1
repetitions       = 3

[communities]
unique = true                # so that gobgpd cannot pack many routes into one UPDATE

[storm]
rounds = 100
resend = ["same", "changed-community"]
